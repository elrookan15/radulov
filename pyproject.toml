[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radulov"
version = "0.1.0"
description = "Autonomous engineering intelligence and Gemini client configured with the Aegis system architecture."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "google-genai>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
radulov = "main:main"

[tool.ruff]
line-length = 88
exclude = [
    "archive",
    ".venv",
    "__pycache__",
]

[tool.flake8]
max-line-length = 88
exclude = [
    "archive",
    ".venv",
    "__pycache__",
]
